<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPTV Player</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Login -->
  <div id="login" class="screen hidden">
    <div class="login-box">
      <h1>تسجيل الدخول</h1>
      <p class="muted">اكتب بيانات اشتراك Xtream مرة واحدة، وهتتحفظ على الشاشة.</p>
      <label>السيرفر <span class="muted">(مثال: http://example.com:8080)</span></label>
      <input id="in-server" class="field" type="url" dir="ltr" autocomplete="off" spellcheck="false">
      <label>اسم المستخدم</label>
      <input id="in-user" class="field" type="text" dir="ltr" autocomplete="off" spellcheck="false">
      <label>كلمة السر</label>
      <input id="in-pass" class="field" type="password" dir="ltr" autocomplete="off">
      <button id="btn-login" class="field btn">دخول</button>
      <div id="login-error" class="error"></div>
    </div>
  </div>

  <!-- Browse -->
  <div id="browse" class="screen hidden">
    <nav id="menu"></nav>
    <section id="cats" class="column">
      <div class="col-title" id="cats-title"></div>
      <div class="vlist" id="cats-list"></div>
    </section>
    <section id="items" class="column">
      <div class="col-title" id="items-title"></div>
      <input id="search-input" class="field hidden" type="text" placeholder="اكتب اسم قناة أو فيلم أو مسلسل..." autocomplete="off" spellcheck="false">
      <div class="vlist" id="items-list"></div>
      <div class="vlist hidden" id="items-grid"></div>
      <div class="empty hidden" id="items-empty"></div>
    </section>
    <div id="hint" class="hint">OK: تشغيل &nbsp;•&nbsp; اضغط OK مطوّل أو الزرار الأصفر: مفضلة &nbsp;•&nbsp; رجوع: للخلف</div>
  </div>

  <!-- Series details -->
  <div id="series" class="screen hidden">
    <div class="series-head">
      <img id="series-cover" alt="">
      <div>
        <h1 id="series-name"></h1>
        <p id="series-plot" class="muted"></p>
      </div>
    </div>
    <div class="series-body">
      <section class="column narrow">
        <div class="col-title">المواسم</div>
        <div class="vlist" id="seasons-list"></div>
      </section>
      <section class="column">
        <div class="col-title">الحلقات</div>
        <div class="vlist" id="episodes-list"></div>
      </section>
    </div>
  </div>

  <!-- Player -->
  <div id="player" class="screen hidden">
    <video id="video" autoplay playsinline></video>
    <div id="spinner" class="spinner hidden"></div>
    <div id="osd" class="osd hidden">
      <div class="osd-row">
        <div id="osd-num" class="osd-num"></div>
        <img id="osd-logo" alt="">
        <div class="osd-text">
          <div id="osd-title" class="osd-title"></div>
          <div id="osd-epg" class="muted"></div>
        </div>
      </div>
      <div id="osd-progress" class="progress hidden">
        <span id="osd-cur">0:00</span>
        <div class="bar"><div id="osd-bar"></div></div>
        <span id="osd-dur">0:00</span>
      </div>
    </div>
    <div id="zap-list" class="zap hidden">
      <div class="col-title" id="zap-title"></div>
      <div class="vlist" id="zap-items"></div>
    </div>
    <div id="num-input" class="num-input hidden"></div>
  </div>

  <div id="loading" class="loading hidden"><div class="spinner"></div><div id="loading-text"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="lib/mpegts.js" onerror="this.remove()"></script>
  <script src="js/util.js"></script>
  <script src="js/xtream.js"></script>
  <script src="js/vlist.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
